"$schema" = 'https://starship.rs/config-schema.json'

# Flat, no fills: every colour here is a foreground on the terminal background,
# so the prompt stays legible in both light and dark mode. Do not reintroduce
# `bg:` pills — container/fill roles invert lightness between modes.

add_newline = true

format = """$directory$git_branch$git_status
$character"""

right_format = """$cmd_duration$nodejs${custom.pnpm}$python$java$php"""

[directory]
format = "[$path]($style)[$read_only](fg:{{colors.term_red.default.hex}}) "
style = "fg:{{colors.primary.default.hex}} bold"
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " ro"

[git_branch]
format = "[$branch]($style)"
style = "fg:{{colors.secondary.default.hex}}"
symbol = ""

[git_status]
format = "[ $all_status$ahead_behind]($style)"
style = "fg:{{colors.outline.default.hex}}"
ahead = "[↑${count}](fg:{{colors.term_cyan.default.hex}})"
behind = "[↓${count}](fg:{{colors.term_cyan.default.hex}})"
diverged = "[↕${ahead_count}/${behind_count}](fg:{{colors.term_magenta.default.hex}})"
staged = "[+${count}](fg:{{colors.term_green.default.hex}})"
modified = "[~${count}](fg:{{colors.term_yellow.default.hex}})"
untracked = "[?${count}](fg:{{colors.term_blue.default.hex}})"
deleted = "[-${count}](fg:{{colors.term_red.default.hex}})"
stashed = "*${count}"
conflicted = "[!${count}](bold fg:{{colors.term_red.default.hex}})"

[character]
success_symbol = "[❯](bold fg:{{colors.primary.default.hex}})"
error_symbol = "[❯](bold fg:{{colors.term_red.default.hex}})"
vimcmd_symbol = "[❮](bold fg:{{colors.tertiary.default.hex}})"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "fg:{{colors.term_yellow.default.hex}}"

[nodejs]
format = "[node $version]($style) "
style = "fg:{{colors.outline.default.hex}}"
symbol = ""
version_format = "${raw}"

[custom.pnpm]
command = "pnpm --version"
when = "test -f pnpm-lock.yaml"
format = "[pnpm $output]($style) "
style = "fg:{{colors.outline.default.hex}}"
shell = ["sh", "-c"]

[python]
format = "[py $version]($style) "
style = "fg:{{colors.outline.default.hex}}"
symbol = ""
version_format = "${raw}"
detect_files = ["requirements.txt", "setup.py", "setup.cfg", "pyproject.toml", "Pipfile", ".python-version"]

[java]
format = "[java $version]($style) "
style = "fg:{{colors.outline.default.hex}}"
symbol = ""
version_format = "${raw}"

[php]
format = "[php $version]($style) "
style = "fg:{{colors.outline.default.hex}}"
symbol = ""
version_format = "${raw}"
