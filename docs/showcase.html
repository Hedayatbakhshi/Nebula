<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showcase — Nebula</title>
<meta name="description" content="Screenshots of the Nebula desktop shell: bar, dashboard, launcher, notification shade, widget canvas, lock screen and settings.">
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="docs">
  <aside class="sidebar" data-open="false" aria-label="Documentation navigation"></aside>

  <main class="content" id="main">
    <p class="crumb"></p>
    <h1>Showcase</h1>
    <p class="lede">Every part of the shell, running on a real desktop. Select a shot
      to open it full size; arrow keys move between them.</p>

    <div class="filters" id="filters" role="group" aria-label="Filter screenshots"></div>
    <div class="gallery" id="gallery"></div>
    <div class="empty" id="empty" hidden></div>
  </main>

  <nav class="toc" aria-label="On this page"></nav>
</div>

<dialog class="lightbox" id="lightbox" aria-label="Screenshot viewer">
  <button class="nav prev" type="button" aria-label="Previous screenshot"></button>
  <button class="nav next" type="button" aria-label="Next screenshot"></button>
  <img alt="">
  <div class="meta"><b></b><span></span><span class="count"></span></div>
</dialog>

<script src="assets/js/site.js"></script>
<script>
/* The gallery. To add a screenshot: drop the file in assets/img/showcase/ and
   add an entry here.

   `span` is how many of the 6 grid columns the tile takes — mix 2, 3, 4 and 6
   so the grid does not read as a plain matrix. `ar` is the tile's aspect ratio
   and defaults to 16/9; set it only when a shot is not a full-screen capture
   (a tall panel might be "3 / 4"). The image is cropped to fill the tile, so an
   `ar` far from the file's own ratio will cut it.

   `small` is optional; without it the full image is used at every size. */
const SHOTS = [
  {
    file: "dashboard.jpg", small: "dashboard@small.jpg",
    title: "Dashboard and notification shade",
    caption: "Sliders, quick toggles, power profiles and grouped notifications.",
    tags: ["shell"], span: 4,
  },
  {
    file: "widgets.jpg", small: "widgets@small.jpg",
    title: "Widget canvas",
    caption: "Clocks, weather, date cards and a sunrise arc, placed by hand.",
    tags: ["widgets"], span: 2,
  },
];

const TAGS = [
  ["all", "Everything"], ["shell", "Shell"], ["launcher", "Launcher"],
  ["widgets", "Widgets"], ["tools", "Tools"], ["lock", "Lock screen"],
  ["settings", "Settings"],
];

const DIR = "assets/img/showcase/";
const gallery = document.getElementById("gallery");
const filters = document.getElementById("filters");
const empty = document.getElementById("empty");
let shown = SHOTS;

const used = new Set(SHOTS.flatMap(s => s.tags));
filters.innerHTML = TAGS
  .filter(([t]) => t === "all" || used.has(t))
  .map(([t, label], i) =>
    `<button type="button" data-tag="${t}" aria-pressed="${i === 0}">${label}</button>`).join("");

function draw(tag) {
  shown = tag === "all" ? SHOTS : SHOTS.filter(s => s.tags.includes(tag));

  gallery.innerHTML = shown.map((s, i) => `
    <figure class="shot"
            style="grid-column:span ${s.span}${s.ar ? `;--ar:${s.ar}` : ``}" role="button" tabindex="0"
            data-i="${i}" aria-label="Open ${s.title} full size">
      <img src="${DIR}${s.small || s.file}"
           srcset="${s.small ? `${DIR}${s.small} 960w, ` : ""}${DIR}${s.file} 1920w"
           sizes="(max-width: 980px) 100vw, ${Math.round(s.span / 6 * 1100)}px"
           loading="lazy" alt="${s.title}. ${s.caption}">
      <figcaption><b>${s.title}</b><span>${s.caption}</span></figcaption>
    </figure>`).join("");

  const none = shown.length === 0;
  empty.hidden = !none;
  gallery.hidden = none;
  if (none) {
    empty.innerHTML = `<b>Nothing here yet</b>
      <p>No screenshot has been tagged for this part of the shell.</p>`;
  }
}

filters.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  filters.querySelectorAll("button").forEach(x =>
    x.setAttribute("aria-pressed", String(x === b)));
  draw(b.dataset.tag);
});

/* ── lightbox ─────────────────────────────────────────────────────── */

const dlg = document.getElementById("lightbox");
const img = dlg.querySelector("img");
const [title, cap, count] = dlg.querySelectorAll(".meta b, .meta span");
const prev = dlg.querySelector(".prev"), next = dlg.querySelector(".next");
prev.innerHTML = ICON.left;
next.innerHTML = ICON.right;
let at = 0;

function show(i) {
  at = (i + shown.length) % shown.length;
  const s = shown[at];
  img.src = DIR + s.file;
  img.alt = `${s.title}. ${s.caption}`;
  title.textContent = s.title;
  cap.textContent = s.caption;
  count.textContent = `${at + 1} / ${shown.length}`;
  const many = shown.length > 1;
  prev.hidden = next.hidden = !many;
}

function openAt(i) { show(i); if (!dlg.open) dlg.showModal(); }

gallery.addEventListener("click", e => {
  const f = e.target.closest(".shot");
  if (f) openAt(+f.dataset.i);
});
gallery.addEventListener("keydown", e => {
  const f = e.target.closest(".shot");
  if (f && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openAt(+f.dataset.i); }
});

prev.addEventListener("click", () => show(at - 1));
next.addEventListener("click", () => show(at + 1));
dlg.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { e.preventDefault(); show(at - 1); }
  if (e.key === "ArrowRight") { e.preventDefault(); show(at + 1); }
});
dlg.addEventListener("click", e => {
  if (!e.target.closest("img, .nav, .meta")) dlg.close();
});
dlg.addEventListener("close", () => {
  gallery.querySelector(`.shot[data-i="${at}"]`)?.focus();
});

draw("all");
</script>
</body>
</html>
